version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-listening-app
    expose:
      - "8501"
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_LOGGER_LEVEL=warning
      - STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=false
      - PYTHONUNBUFFERED=1
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    labels:
      - "com.example.description=Social Listening Report Generator"
      - "com.example.version=1.0.0"
      - "com.example.environment=production"

  nginx:
    image: nginx:alpine
    container_name: social-listening-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./reports:/usr/share/nginx/html/reports:ro
    depends_on:
      - app
    restart: always
    networks:
      - app-network
    labels:
      - "com.example.description=Nginx Reverse Proxy"
      - "com.example.version=1.0.0"

networks:
  app-network:
    driver: bridge

volumes:
  reports:
  data:
  uploads:
