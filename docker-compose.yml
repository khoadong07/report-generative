version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-listening-app
    ports:
      - "8521:8501"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_LOGGER_LEVEL=info
      - STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=false
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - app-network
    labels:
      - "com.example.description=Social Listening Report Generator"
      - "com.example.version=1.0.0"

networks:
  app-network:
    driver: bridge
