version: '3.8'

services:
  streamlit-app:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: slide-prompt-generator
    ports:
      - "8522:8501"
    environment:
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
    env_file:
      - ${PWD}/.env
    volumes:
      # Mount uploads directory for persistence
      - ../uploads:/app/uploads
      # Mount .env for easy updates (optional)
      - .env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # FastAPI Server
  api-server:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.api
    container_name: slide-prompt-api
    ports:
      - "8524:8000"
    environment:
      - PORT=8000
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
    env_file:
      - .env
    volumes:
      # Mount uploads directory for file uploads
      - ../uploads:/app/uploads
      # Mount logs directory (optional)
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Optional: Nginx reverse proxy for API
  nginx:
    image: nginx:alpine
    container_name: slide-prompt-nginx
    ports:
      - "8080:80"  # Changed to avoid conflict with other services
    volumes:
      - ./nginx.api.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-nginx  # Optional profile, enable with --profile with-nginx

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  logs:
